name: Pipeline

# Hourly: fetch → process → export, then build the site and deploy it to GitHub Pages.
# State lives on the orphan `data` branch (DESIGN §10.1). Scheduled runs only
# happen on the default branch.

on:
  schedule:
    - cron: "17 * * * *" # off the top of the hour, when Actions is busiest
  workflow_dispatch:

permissions: {} # each job asks for only what it needs

concurrency:
  group: pipeline # runs never overlap (they share the data branch)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the data branch
    steps:
      - uses: actions/checkout@v7

      - name: Check out state (data branch)
        run: .github/scripts/state.sh checkout state

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[embed]"

      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-BAAI-bge-small-en-v1.5-v1

      - name: Run pipeline
        run: python -m pipeline run --state state --out out
        env:
          # With the model cached, don't contact the Hugging Face Hub at all.
          HF_HUB_OFFLINE: ${{ steps.model-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          # Owner overrides (DESIGN §10.2). The token can only read them. If either is
          # unset or the Worker is down, the run uses the overrides saved on `data`.
          WORKER_URL: ${{ vars.WORKER_URL }}
          WORKER_PIPELINE_TOKEN: ${{ secrets.WORKER_PIPELINE_TOKEN }}

      - name: Save state
        run: .github/scripts/state.sh commit state

      - uses: actions/upload-artifact@v7
        with:
          name: feed
          path: out/feed
          retention-days: 1
          if-no-files-found: error

  build:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/download-artifact@v8
        with:
          name: feed
          path: web/build/feed

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
