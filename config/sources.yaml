# Sources: where items come from. Curated 2026-11-21.
#
# status:   active | trial | disabled   (trial = badged in the feed; disabled = never fetched)
# kind:     default content kind: reporting | analysis | opinion | study | listing | guide
# lean:     news/opinion outlets only: left | lean_left | center | lean_right | right
#           Source: AllSides Media Bias Ratings. Only ratings confirmed on 2026-11-21 are
#           filled in; the rest are null with a "# AllSides: check" note. Confirm before Phase 3.
# paywall:  none | partial | full   (partial/full show a lock badge on cards)
# verified: true once the URL has returned a valid feed in a real pipeline run.
#
# Types: rss | reddit             fetched from Phase 1
#        github_list | nyt_books | fred    fetchers arrive in Phase 4; disabled until then
#
# Google News search feeds (used for Reuters) are plain `rss`. Items have headlines only,
# and links go through news.google.com.

