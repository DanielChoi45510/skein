# Topics: what the feed follows.
#
# `description`, `include` and `exclude` are used for relevance matching
# (embedded as positive / negative anchors), so write them as plain English.
# This file is PUBLIC. Keep personal details (gear, health, job profile) in the
# private profile instead; see profile.example.yaml.
#
# Modes: threaded | flat | tracker | question | fixed | listings | reading_list
# (see docs/DESIGN.md §4; patch_cycle is parked, see DESIGN "Parked")

defaults:
  daily_cap_per_thread: 5        # overflow collapses behind "+N more", never dropped
  cooling_after_days: 3          # thread lifecycle (DESIGN §5): active → cooling → dormant → archived
  dormant_after_days: 14
  archive_after_days: 60
  lookback_days: 7               # ignore items older than this on first sight
  relevance_threshold: 0.50      # calibrated 2026-11-22 on 52 verified sources, query instruction off
                                 # (python -m pipeline.calibrate); recalibrate after changing sources
  structure:                     # spine-and-branches thread view (DESIGN §6.9); picked 2026-11-24
    link: 0.72                   #   storylines merge while their average pairwise cosine is ≥ this
    link_predefined: 0.65        #   the same for tracker / fixed threads, which are broad by design
    min_items: 3                 #   smaller threads are all spine
    min_branch_items: 1          #   storylines smaller than this fold into the spine (story threads) …
    min_branch_items_predefined: 2  # … and in tracker / fixed threads, where one-item asides are mostly noise
    anchor_day_penalty: 0.15     #   a branch hangs off the spine item best by cosine − 0.15 × days apart
    related: 0.80                #   related threads: thread-centroid cosine ≥ this …
    related_max: 5               #   … at most this many, most similar first

groups:
  - { id: ai,     name: AI }
  - { id: tech,   name: Tech }
  - { id: health, name: Health }
  - { id: news,   name: News }
  - { id: money,  name: Money & Jobs }
  - { id: read,   name: Reading }

global_filters:                  # on for every topic unless listed in a topic's `filters_off`
  hype: Breathless "this changes everything" posts with no concrete facts, numbers or specifics.
  memes: Memes, jokes, shitposts and humor posts.
  doom: Doom posting and speculation about catastrophe without new evidence.
  listicles: '"Top 10" style roundups and "X things you need" lists.'
  charged_extremes: Emotionally charged, one-sided takes from either political extreme; outrage framing.
  engagement_bait: Rage bait, clickbait and engagement-farming posts, including LinkedIn-style posts.
  influencer: Influencer content (fitness, career, tech) built for personal brand rather than information.
  obvious_advice: Generic advice any informed adult already knows, with no specific number, dose, comparison or method.

topics:

  # ───────────────────────────── AI ─────────────────────────────
  - id: ai-practice
    name: AI in practice
    group: ai
    mode: flat
    max_per_day: 5
    description: >
      Practical ways to get more out of AI tools and agents: concrete workflows,
      setups and automations that complete real tasks, for example editing a LaTeX
      paper with a coding agent through a Git repo, or a skill file that plans and
      tracks workouts. Focused on agents and tools that complete tasks for you.
    include:
      - Step-by-step workflow using a coding agent in VSCode
      - How to set up an AI agent to automate a recurring personal task
      - New feature in an AI assistant and how to use it effectively
    exclude:
      - AI image or video generation
      - Running models locally on your own hardware
      - '"10 prompts you need" lists'

  - id: ai-news
    name: AI news
    group: ai
    mode: threaded
    dormant_after_days: 21
    description: >
      The AI industry: company strategy, funding, stock moves and deals; new model
      and product releases; regulation affecting AI companies. Research only when it
      is a major breakthrough. Facts and numbers, not hype or doom.
    include:
      - AI company announces new model with benchmark results
      - AI startup raises funding round or is acquired
      - AI company restructures, changes leadership or strategy
    exclude:
      - AI doom or existential-risk debate
      - Incremental academic papers

  # ───────────────────────────── TECH ─────────────────────────────
  - id: tech-trackers
    name: Tech trackers
    group: tech
    mode: tracker
    compare_with_profile: gear     # compare against the private gear list
    # Items go to the thread whose `description` (else title) they're most similar to.
    threads:
      - id: phones
        title: Phones
        description: "Smartphones: iPhone, Pixel, Galaxy and other phone launches, reviews and software updates"
      - id: laptops
        title: Laptops
        description: "Laptops: MacBook, Windows and Chromebook laptop launches and reviews"
      - id: audio
        title: Headphones & earbuds
        description: "Headphones and earbuds: AirPods, wireless earbuds, over-ear headphones, reviews"
      - id: wearables
        title: Wearables
        description: "Wearables: smartwatches, Apple Watch, fitness trackers, smart rings, smart glasses"
      - id: tablets
        title: Tablets
        description: "Tablets: iPad, Android tablets, Galaxy Tab, reviews"
    description: >
      New releases, in-depth reviews with real testing, and major updates for phones,
      laptops, headphones and earbuds, wearables and tablets. Emphasis on how new
      products compare with current best-in-class options.
    exclude:
      - Rumor roundups with no sourcing
      - Deal posts and sales
      - Software beta and release-candidate builds
      - TV, movie and streaming listings and schedules

  - id: everyday-upgrades
    name: Everyday upgrades
    group: tech
    mode: flat
    max_per_week: 10
    filters_off: [listicles]       # listicles are a useful starting point here
    description: >
      Products that make daily life easier that most people don't know about: desk
      lamps and softer lighting, battery packs, chargers and charging stands,
      backpacks, laptop and phone accessories. Prefer reviews with clear testing
      criteria.
    include:
      - Review of a 3-in-1 charging stand with testing results
      - Best desk lamps for a small room tested
      - Battery pack comparison with measured capacity

  # ───────────────────────────── HEALTH ─────────────────────────────
  # All health topics: articles about studies (DESIGN §8.2), study cards on, evidence badges on.
  - id: health-training
    name: Training
    group: health
    mode: question
    evidence: articles_about_studies
    study_cards: true
    max_per_week: 4
    cooling_after_days: 30
    dormant_after_days: 120
    archive_after_days: 365        # must exceed dormant_after_days
    description: >
      Exercise science on resistance training for hypertrophy (volume, frequency,
      rep ranges, proximity to failure, rest periods) and on cardio for improving
      VO2 max (zone 2, intervals, programming).
    exclude:
      - Influencer workout programs
      - Supplement marketing

  - id: health-sleep
    name: Sleep
    group: health
    mode: question
    evidence: articles_about_studies
    study_cards: true
    max_per_week: 2
    cooling_after_days: 30
    dormant_after_days: 120
    archive_after_days: 365        # must exceed dormant_after_days
    description: >
      Sleep science and evidence-backed techniques for better sleep quality and
      consistency: timing, environment, light exposure, caffeine, naps.

  - id: health-nutrition
    name: Nutrition on a budget
    group: health
    mode: question
    evidence: articles_about_studies
    study_cards: true
    max_per_week: 2
    cooling_after_days: 30
    dormant_after_days: 120
    archive_after_days: 365        # must exceed dormant_after_days
    description: >
      Evidence on nutrient-dense, cost-effective foods and grocery planning, and on
      steady, sustainable weight loss while keeping enough protein for muscle.
    exclude:
      - Extreme or fad diets
      - Single-food "causes cancer" or "miracle food" headlines

  - id: health-wellbeing
    name: General well-being
    group: health
    mode: question
    evidence: articles_about_studies
    study_cards: true
    max_per_week: 2
    cooling_after_days: 30
    dormant_after_days: 120
    archive_after_days: 365        # must exceed dormant_after_days
    description: >
      Evidence on avoiding illness, mental health, and long-term health and
      longevity, with specific, actionable findings.

  # ───────────────────────────── NEWS ─────────────────────────────
  - id: us-politics
    name: US politics
    group: news
    mode: threaded
    relevance_threshold: 0.45      # calibrated 2026-11-22: 0.50 hid real news (e.g. 0.48-0.49)
    dormant_after_days: 10
    primers: true
    opinion: { allowed: true, label: true, balance_across_lean: true }
    description: >
      US national politics and policy: the economy and taxes, tech and AI
      regulation, healthcare, education and student loans, foreign policy, and
      major legislation with broad effects on the legal system. Landmark court
      rulings with nationwide effects. Energy and climate only for major changes.
    exclude:
      - Routine court proceedings
      - Immigration policy (low interest)
      - Local or state news
      - Campaign gossip and horse-race polling chatter

  - id: world-news
    name: World news
    group: news
    mode: threaded
    relevance_threshold: 0.45      # calibrated 2026-11-22: 0.50 hid real news (e.g. 0.46-0.48)
    dormant_after_days: 14
    primers: true
    opinion: { allowed: true, label: true, balance_across_lean: true }
    weekly_region_roundup: true
    regions:
      - Americas
      - Europe                     # includes Russia and Ukraine
      - Middle East & North Africa
      - Sub-Saharan Africa
      - East Asia
      - South Asia
      - Southeast Asia             # includes island nations
      - Oceania
      - Global                     # UN, trade blocs, summits
    description: >
      Major world events outside the US: wars and conflicts, elections and changes
      of government, diplomacy, economic shifts, and major policy changes in
      influential countries and regions.

  # ───────────────────────────── MONEY & JOBS ─────────────────────────────
  - id: markets
    name: Markets
    group: money
    mode: fixed
    advice: never                  # report news; never buy/sell recommendations
    panel:
      provider: fred
      series: [SP500, NASDAQCOM, DJIA]   # daily closes; Phase 4
    threads:                       # items go to the nearest `description` (else title)
      # 11 GICS sectors
      - id: it
        title: Information Technology
        description: "Information technology sector: software, semiconductors, chipmakers, cloud and tech company stocks"
      - id: comms
        title: Communication Services
        description: "Communication services sector: telecom, media, social networks, advertising and streaming stocks"
      - id: discretionary
        title: Consumer Discretionary
        description: "Consumer discretionary sector: retailers, automakers, restaurants, travel and consumer spending"
      - id: staples
        title: Consumer Staples
        description: "Consumer staples sector: food, beverages, household products and grocery companies"
      - id: health-care
        title: Health Care
        description: "Health care sector: pharmaceutical, biotech, medical device and insurer stocks"
      - id: financials
        title: Financials
        description: "Financials sector: banks, insurers, asset managers, brokerages and fintech"
      - id: industrials
        title: Industrials (incl. aerospace & defense)
        description: "Industrials sector: aerospace, defense, airlines, railroads, machinery and manufacturing"
      - id: energy
        title: Energy
        description: "Energy sector: oil, natural gas, OPEC, crude prices and energy companies"
      - id: utilities
        title: Utilities
        description: "Utilities sector: electric and gas utilities, power grid and electricity demand"
      - id: materials
        title: Materials
        description: "Materials sector: mining, metals, chemicals, gold and copper prices"
      - id: real-estate
        title: Real Estate
        description: "Real estate sector: REITs, housing market, mortgages and commercial property"
      # economy-wide
      - id: fed-rates
        title: Fed & interest rates
        description: "Federal Reserve and interest rates: Fed meetings, rate cuts and hikes, bond yields"
      - id: macro-data
        title: Inflation & jobs reports
        description: "Economic data: inflation CPI reports, jobs reports, unemployment, GDP"
      - id: trade
        title: Trade & tariffs
        description: "Trade and tariffs: tariff announcements, trade deals, import and export policy"
      - id: earnings
        title: Major earnings surprises
        description: "Major earnings surprises: quarterly results that beat or miss expectations, guidance"
    description: >
      Broad stock-market and economic news across all sectors: big moves, earnings,
      sector trends, the Federal Reserve, inflation, jobs data and trade policy.

  - id: jobs-listings
    name: Job listings
    group: money
    mode: listings
    target_per_week: 25            # 20–30
    match_profile: jobs            # uses the private job profile
    description: >
      Internship (first) and new-grad (second) openings for software engineering,
      machine learning, AI and data roles at companies in any industry, including
      healthcare, defense, biotech and finance, not only big tech.

  - id: jobs-market
    name: Job market
    group: money
    mode: threaded
    dormant_after_days: 14
    description: >
      Tech hiring trends: companies changing direction or opening new teams,
      in-demand skills, salary data, and what technical interviews are asking now.
      Layoffs and hiring freezes at lower priority.
    exclude:
      - LinkedIn influencer career posts
      - Generic "how to stand out" advice

  - id: jobs-guides
    name: Job-search guides
    group: money
    mode: flat
    max_per_week: 5
    description: >
      Concrete guides for landing tech internships and jobs: what to practice for
      coding and system-design interviews, systems for finding and applying to many
      listings efficiently (including less-known listings), and project ideas that
      build in-demand skills. Networking and resume formatting at low priority.
    exclude:
      - Offer negotiation
      - Motivational career content

  # ───────────────────────────── READING ─────────────────────────────
  - id: books
    name: Reading list
    group: read
    mode: reading_list
    relevance_threshold: 0.45      # PROVISIONAL: calibrated on 3 items (2026-11-22)
    max_per_month: 4
    description: >
      High-impact nonfiction that is widely considered a must-read, and new
      nonfiction with real buzz about AI, the economy, and practical life skills.
    exclude:
      - Fiction
      - Celebrity memoirs
